<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YarOperator — Executive Assistant</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Navigation -->
    <header class="app-header">
      <div class="brand-section">
        <div class="yo-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 20 20 L 50 50 L 50 85" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 80 20 L 50 50" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="38" stroke="#D4AF37" stroke-width="4" stroke-dasharray="8 6" opacity="0.4"/>
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-name">YarOperator</span>
          <span class="brand-tagline">Executive Assistant</span>
        </div>
      </div>

      <div class="header-status">
        <div class="auth-section" id="authSection">
          <a href="/auth/google" id="loginBtn" class="google-login-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
            ورود با حساب گوگل
          </a>
          <div id="userBadge" class="user-badge hidden">
            <span id="userEmail" class="user-email"></span>
            <button id="logoutBtn" class="logout-btn">خروج</button>
          </div>
        </div>
        <div class="connection-pill" id="connectionPill">
          <span class="status-dot"></span>
          <span class="status-label" id="statusLabel">آماده</span>
        </div>
      </div>
    </header>

    <!-- Main Executive Chat Area -->
    <main class="chat-main" id="chatMain" aria-live="polite">
      <div class="welcome-banner" id="welcomeBanner">
        <div class="hero-yo-mark">
          <svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 20 20 L 50 50 L 50 85" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 80 20 L 50 50" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="42" stroke="#D4AF37" stroke-width="2" opacity="0.3"/>
          </svg>
        </div>
        <h1 class="welcome-title">سلام. در خدمتم.</h1>
        <p class="welcome-sub">دستور یا هدف مورد نظر خود را بنویسید.</p>
      </div>

      <div class="messages-list" id="messagesList" role="log"></div>
    </main>

    <!-- Floating Thinking Indicator -->
    <div class="thinking-bar hidden" id="thinkingBar">
      <div class="y-pulse"></div>
      <span class="thinking-text">در حال تفکر...</span>
    </div>

    <!-- Executive Input Boundary -->
    <footer class="input-footer">
      <form class="input-form" id="chatForm">
        <div class="input-wrapper">
          <textarea
            id="chatInput"
            class="chat-textarea"
            placeholder="دستور خود را بنویسید..."
            rows="1"
            aria-label="پیام یا دستور مالک"
            required
          ></textarea>
          <button type="submit" id="sendBtn" class="send-button" aria-label="ارسال دستور">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M 22 2 L 11 13"></path>
              <path d="M 22 2 L 15 22 L 11 13 L 2 9 L 22 2 Z"></path>
            </svg>
          </button>
        </div>
        <div class="input-footer-hint">
          <span>Enter = ارسال | Shift + Enter = خط جدید</span>
        </div>
      </form>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
